<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; base-uri 'none'; form-action 'none'; img-src 'self' data:; style-src 'self'; script-src 'none'; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- Weiterleitung der alten URL. GitHub Pages kann keinen 301 senden, daher
       ein sofortiger Meta-Refresh (0 s ist nach WCAG 2.2.1 zulässig) plus ein
       sichtbarer Link als Rückfallebene. -->
  <meta http-equiv="refresh" content="0; url=impressum.html">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://haug-it.eu/impressum.html">
  <title>Impressum — Weiterleitung | haug-it.eu</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/brand.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <main id="main">
    <section class="section error-page">
      <div class="container">
        <h1>Seite umgezogen</h1>
        <p>Das Impressum liegt jetzt unter <code>/impressum.html</code>.</p>
        <div class="error-page__actions">
          <a class="btn btn--primary" href="impressum.html">Zum Impressum</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
