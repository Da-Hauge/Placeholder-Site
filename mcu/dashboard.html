  <header class="site-header">

      <a class="brand" href="../">
        <span class="brand__sigil">~/</span><span>haug-it</span><span class="brand__dim">.eu</span>
      </a>

          </ul>
        </nav>
        <div class="header__end">
          <button type="button" class="btn btn--ghost" id="mcu-lang-toggle" lang="de">DE</button>
          <button class="theme-toggle" type="button" data-theme-toggle>
              <svg data-icon="auto" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg>
              <svg data-icon="light" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
              <svg data-icon="dark" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="section section--tight">
      <div class="container">
        <p class="eyebrow">MCU Tracker</p>
        <h1 data-i18n="dashboardTitle">MCU Tracker — Dashboard</h1>
        <p class="section__lead" data-i18n="dashboardLead">
          Where your watch-through stands: how much is done, how much is
          left, and when you watched it.
        </p>
        <noscript>
          <p class="note">This dashboard needs JavaScript — it reads your saved progress from this browser only.</p>
        </noscript>
      </div>
    </section>

    <div id="mcu-dash" class="section section--tight" hidden>
      <div class="container">
        <div class="mcu-stats" id="mcu-dash-stats"></div>

        <section class="mcu-chartcard" id="mcu-dash-overtime"></section>

        <div class="mcu-chartgrid">
          <section class="mcu-chartcard" id="mcu-dash-by-category"></section>
          <section class="mcu-chartcard" id="mcu-dash-by-studio"></section>
          <section class="mcu-chartcard" id="mcu-dash-by-tier"></section>
        </div>
      </div>
    </div>
  </main>
